<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Logistics Dashboard - Swiftora Xpress</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    
    <style>
        :root {
            --bg-main: #050811;
            --bg-surface: #0E1322;
            --bg-card: #161C2E;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(0, 240, 255, 0.3);
            
            --brand-primary: #00F0FF;
            --brand-secondary: #3B82F6;
            --brand-gradient: linear-gradient(135deg, #00F0FF 0%, #3B82F6 100%);
            
            --text-heading: #FFFFFF;
            --text-body: #94A3B8;
            --text-muted: #64748B;
            
            --shadow-glow: 0 0 30px rgba(0, 240, 255, 0.15);
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Syne', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-body);
            line-height: 1.6;
            padding: 40px 20px 80px 20px;
            min-height: 100vh;
        }

        /* Glass Header Bar */
        .admin-header {
            max-width: 900px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 16px 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .header-logo-img {
            height: 38px;
            width: auto;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--border-accent);
            color: var(--brand-primary);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--brand-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--brand-primary);
        }

        /* Main Form Box */
        .admin-box {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }

        .admin-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--brand-gradient);
        }

        h2 {
            color: var(--text-heading);
            font-size: 1.8rem;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h2 i {
            color: var(--brand-primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field label {
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field input, .field select, .field textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-heading);
            font-size: 0.95rem;
            outline: none;
            font-weight: 600;
        }

        .field input:focus, .field select:focus, .field textarea:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
        }

        .field select option {
            background: var(--bg-surface);
            color: var(--text-heading);
        }

        .btn-submit {
            margin-top: 10px;
            width: 100%;
            padding: 16px;
            background: var(--brand-gradient);
            color: #000000;
            font-size: 1rem;
            font-weight: 800;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            box-shadow: var(--shadow-glow);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        @media(max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .admin-box {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

<div class="admin-header">
    <a href="index.html" class="logo-container">
        <img src="swiftoralogo.png" alt="Swiftora Xpress Logo" class="header-logo-img">
    </a>
    <div class="admin-badge">
        <span class="pulse-dot"></span> HQ Command Terminal
    </div>
</div>

<div class="admin-box">
    <h2><i class="fa-solid fa-sliders"></i> Swiftora Shipment Data Entry</h2>
    <form id="adminForm" class="form-grid">
        <div class="field full-width">
            <label>Select Tracking ID</label>
            <select id="trackingIdSelect" required></select>
        </div>

        <div class="field"><label>Sender Name</label><input type="text" id="senderName" required></div>
        <div class="field"><label>Sender Phone</label><input type="text" id="senderPhone" required></div>
        <div class="field full-width"><label>Sender Full Address</label><input type="text" id="senderAddr" required></div>

        <div class="field"><label>Receiver Full Name</label><input type="text" id="recName" required></div>
        <div class="field"><label>Receiver Gender</label>
            <select id="recGender"><option>Male</option><option>Female</option></select>
        </div>
        <div class="field"><label>Receiver Email</label><input type="email" id="recEmail" required></div>
        <div class="field"><label>Receiver Phone Number</label><input type="text" id="recPhone" required></div>
        <div class="field"><label>Destination Country</label><input type="text" id="recCountry" required></div>
        <div class="field full-width"><label>Receiver House Address</label><input type="text" id="recAddr" required></div>

        <div class="field full-width"><label>Package Details</label><textarea id="pkgDetails" rows="2" required></textarea></div>
        <div class="field"><label>Package Weight (kg)</label><input type="text" id="pkgWeight" required></div>
        <div class="field"><label>Custom Hold Clearance Fee ($)</label><input type="text" id="customsFee" required></div>
        <div class="field"><label>Dispatched Date</label><input type="date" id="sendDate" required></div>
        <div class="field"><label>Expected Arrival Date</label><input type="date" id="arrivalDate" required></div>

        <button type="submit" class="btn-submit full-width"><i class="fa-solid fa-floppy-disk"></i> Save & Update Shipment Track</button>
    </form>
</div>

<script>
    const validIds = [
        "SWFT-583214-HME-DELPAY", "SWFT-741906-HME-DELPAY", "SWFT-326581-HME-DELPAY", 
        "SWFT-905437-HME-DELPAY", "SWFT-218763-HME-DELPAY", "SWFT-674129-HME-DELPAY", 
        "SWFT-450872-HME-DELPAY", "SWFT-813645-HME-DELPAY", "SWFT-392704-HME-DELPAY", 
        "SWFT-167538-HME-DELPAY", "SWFT-729451-HME-DELPAY", "SWFT-584306-HME-DELPAY", 
        "SWFT-936172-HME-DELPAY", "SWFT-251849-HME-DELPAY", "SWFT-608735-HME-DELPAY", 
        "SWFT-473920-HME-DELPAY", "SWFT-815267-HME-DELPAY", "SWFT-349681-HME-DELPAY", 
        "SWFT-762503-HME-DELPAY", "SWFT-194826-HME-DELPAY", "SWFT-537410-HME-DELPAY", 
        "SWFT-680295-HME-DELPAY", "SWFT-421738-HME-DELPAY", "SWFT-853604-HME-DELPAY", 
        "SWFT-276915-HME-DELPAY", "SWFT-914682-HME-DELPAY", "SWFT-365207-HME-DELPAY", 
        "SWFT-748319-HME-DELPAY", "SWFT-502764-HME-DELPAY", "SWFT-189435-HME-DELPAY", 
        "SWFT-637821-HME-DELPAY", "SWFT-824506-HME-DELPAY", "SWFT-293617-HME-DELPAY", 
        "SWFT-571948-HME-DELPAY", "SWFT-406283-HME-DELPAY", "SWFT-957314-HME-DELPAY", 
        "SWFT-138692-HME-DELPAY", "SWFT-695427-HME-DELPAY", "SWFT-347815-HME-DELPAY", 
        "SWFT-782164-HME-DELPAY", "SWFT-519603-HME-DELPAY", "SWFT-264738-HME-DELPAY", 
        "SWFT-871529-HME-DELPAY", "SWFT-430186-HME-DELPAY", "SWFT-756942-HME-DELPAY", 
        "SWFT-315807-HME-DELPAY", "SWFT-683251-HME-DELPAY", "SWFT-927463-HME-DELPAY", 
        "SWFT-548170-HME-DELPAY", "SWFT-201936-HME-DELPAY"
    ];

    const select = document.getElementById('trackingIdSelect');
    validIds.forEach(id => {
        let opt = document.createElement('option');
        opt.value = id;
        opt.innerHTML = id;
        select.appendChild(opt);
    });

    document.getElementById('adminForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const selectedId = select.value;
        const payload = {
            senderName: document.getElementById('senderName').value,
            senderPhone: document.getElementById('senderPhone').value,
            senderAddr: document.getElementById('senderAddr').value,
            recName: document.getElementById('recName').value,
            recGender: document.getElementById('recGender').value,
            recEmail: document.getElementById('recEmail').value,
            recPhone: document.getElementById('recPhone').value,
            recCountry: document.getElementById('recCountry').value,
            recAddr: document.getElementById('recAddr').value,
            pkgDetails: document.getElementById('pkgDetails').value,
            pkgWeight: document.getElementById('pkgWeight').value,
            customsFee: document.getElementById('customsFee').value,
            sendDate: document.getElementById('sendDate').value,
            arrivalDate: document.getElementById('arrivalDate').value
        };

        localStorage.setItem('swiftora_' + selectedId, JSON.stringify(payload));
        alert('Data for ' + selectedId + ' updated successfully!');
    });
</script>
</body>
</html>
